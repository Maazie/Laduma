<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Laduma Toolkit</title>
<style>
:root{--s950:#12151A;--s900:#1B1F24;--s850:#20262c;--s800:#262c33;--s700:#383f47;--paper:#eeeae2;--dim:#9ca6ac;--amber:#e2a63c;--danger:#d9695b}
*{box-sizing:border-box}body{margin:0;background:var(--s950);color:var(--paper);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--s950);border-bottom:1px solid var(--s700);padding:17px}h1{font-size:22px;margin:0}header p{margin:3px 0;color:var(--dim);font-size:13px}header strong{color:var(--amber)}
main{max-width:600px;margin:auto;padding:16px 16px 92px}.title{font-size:19px;font-weight:700;margin:4px 0 13px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:var(--s900);border-top:1px solid var(--s700);padding:5px 3px env(safe-area-inset-bottom)}
nav button{background:none;border:0;color:var(--dim);padding:7px 1px;font-size:11px}nav button.active{color:var(--amber)}
button{font:inherit} .fab{position:fixed;right:19px;bottom:82px;width:54px;height:54px;border-radius:50%;border:0;background:var(--amber);color:#12151A;font-size:27px;z-index:7;box-shadow:0 5px 15px #0008}
.card,.form{background:var(--s850);border:1px solid var(--s700);border-radius:10px;padding:13px;margin-bottom:10px}.task{border-left:4px solid #8b929a}.task.progress{border-left-color:#5b8fd9}.task.done{border-left-color:#5fa06a;opacity:.82}
.row{display:flex;justify-content:space-between;gap:8px}.muted{color:var(--dim);font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
input,textarea,select{width:100%;background:var(--s800);border:1px solid var(--s700);color:var(--paper);padding:10px;border-radius:8px;font-size:14px;margin:4px 0 9px}textarea{min-height:90px}.primary,.ghost{border-radius:8px;padding:9px 15px;border:1px solid var(--s700)}.primary{background:var(--amber);color:#12151A;border:0}.ghost{background:transparent;color:var(--paper)}
.chips{display:flex;gap:6px;overflow:auto;margin-bottom:13px}.chip{white-space:nowrap;border-radius:99px;padding:6px 11px;background:var(--s850);border:1px solid var(--s700);color:var(--dim)}.chip.active{color:var(--amber);border-color:#b9822c}
.empty{text-align:center;color:var(--dim);padding:50px 20px}.empty b{display:block;color:var(--paper);margin-bottom:5px}
.thumbgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.thumb{aspect-ratio:1;overflow:hidden;border-radius:8px;border:1px solid var(--s700)}.thumb img{width:100%;height:100%;object-fit:cover}
dialog{width:100%;max-width:600px;height:100%;border:0;background:#0b0d0f;color:var(--paper);padding:15px}.lightimg{max-width:100%;max-height:65vh;display:block;margin:auto}
small{color:var(--dim)}
</style></head><body>
<header><h1>Laduma Toolkit</h1><p>Supervisor workspace at Laduma Hardware</p><p id="status"></p></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const DBN='ladumaToolkit', STORES=['tasks','notes','photos','contacts','contract']; let db,tab='tasks',filter='all',editing=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>STORES.forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function all(s){return new Promise((res,rej)=>{let q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function put(s,v){return new Promise((res,rej)=>{let q=db.transaction(s,'readwrite').objectStore(s).put(v);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
function del(s,id){return new Promise((res,rej)=>{let q=db.transaction(s,'readwrite').objectStore(s).delete(id);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
function fmt(x){return x?new Date(x).toLocaleString('en-ZA',{dateStyle:'medium',timeStyle:'short'}):''}
async function data(){let a={};for(let s of STORES)a[s]=await all(s);return a}
async function render(){let d=await data();document.getElementById('status').innerHTML='<strong>'+d.tasks.filter(x=>x.status==='pending').length+'</strong> pending, <strong>'+d.tasks.filter(x=>x.status==='in-progress').length+'</strong> in progress';document.getElementById('nav').innerHTML=[['tasks','✓','Tasks'],['notes','✎','Notes'],['photos','▣','Photos'],['contacts','♙','Contacts'],['contract','▤','Contract']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()">${x[1]}<br>${x[2]}</button>`).join('');let a=document.getElementById('app');a.innerHTML=tab==='tasks'?tasks(d):tab==='notes'?notes(d):tab==='photos'?photos(d):tab==='contacts'?contacts(d):contract(d)}
function tasks(d){let fs=d.tasks.filter(x=>filter==='all'||x.status===filter);return `<h2 class=title>Tasks</h2><div class=chips>${[['all','All'],['pending','Pending'],['in-progress','In progress'],['complete','Complete']].map(x=>`<button class="chip ${filter===x[0]?'active':''}" onclick="filter='${x[0]}';render()">${x[1]} (${d.tasks.filter(t=>x[0]==='all'||t.status===x[0]).length})</button>`).join('')}</div>${fs.length?fs.map(t=>`<div class="card task ${t.status==='in-progress'?'progress':''} ${t.status==='complete'?'done':''}"><div class=row><div><b>${esc(t.title)}</b><div class=muted>${esc(t.description)}</div></div><div><button onclick="editTask('${t.id}')">✎</button><button onclick="remove('tasks','${t.id}')">×</button></div></div><div class=actions><button class=chip onclick="cycle('${t.id}')">${t.status}</button>${t.dueDate?'<small>Due '+esc(t.dueDate)+'</small>':''}</div></div>`).join(''):'<div class=empty><b>No tasks here yet</b>Tap + to add one.</div>'}<button class=fab onclick="newTask()">+</button>`}
function notes(d){return `<h2 class=title>Training notes</h2>${d.notes.length?d.notes.map(n=>`<div class=card><div class=row><b>${esc(n.title||'Untitled note')}</b><span><button onclick="editNote('${n.id}')">✎</button><button onclick="remove('notes','${n.id}')">×</button></span></div><small>${fmt(n.createdAt)}</small><p style="white-space:pre-wrap;line-height:1.65">${esc(n.content)}</p></div>`).join(''):'<div class=empty><b>No notes yet</b>Add one during your next training session.</div>'}<button class=fab onclick="newNote()">+</button>`}
function photos(d){return `<h2 class=title>Photos</h2>${d.photos.length?'<div class=thumbgrid>'+d.photos.map(p=>`<div class=thumb onclick="viewPhoto('${p.id}')"><img src="${p.dataUrl}" alt=""></div>`).join('')+'</div>':'<div class=empty><b>No photos yet</b>Use + to take a photo or choose from gallery.</div>'}<button class=fab onclick="photoMenu()">＋</button>`}
function contacts(d){return `<h2 class=title>Contacts</h2><input id=search placeholder="Search by name, store or role" oninput="renderContacts()"><div id=contactlist></div><button class=fab onclick="newContact()">+</button><script>setTimeout(renderContacts,0)<\/script>`}
async function renderContacts(){let d=await data(),q=(document.getElementById('search')?.value||'').toLowerCase(),c=d.contacts.filter(x=>!q||[x.name,x.store,x.jobTitle].join(' ').toLowerCase().includes(q));document.getElementById('contactlist').innerHTML=c.length?c.map(x=>`<div class=card><div class=row><div><b>${esc(x.name)}</b><div class=muted>${esc(x.jobTitle)}</div><small>${esc(x.store)}</small></div><span><button onclick="editContact('${x.id}')">✎</button><button onclick="remove('contacts','${x.id}')">×</button></span></div><div class=actions>${x.phone?`<a class=ghost href="tel:${esc(x.phone)}">☎ Call</a>`:''}${x.email?`<a class=ghost href="mailto:${esc(x.email)}">✉ Email</a>`:''}</div><div class=muted>${esc(x.notes)}</div></div>`).join(''):'<div class=empty><b>No contacts</b>Add a manager or colleague.</div>'}
function contract(d){let c=d.contract[0]||{id:1,details:'',fileDataUrl:null};return `<h2 class=title>Contract</h2><div class=card><b>Key details</b><textarea id=cd placeholder="Start date, position, pay, notice period, working hours...">${esc(c.details)}</textarea><button class=primary onclick="saveContract()">Save details</button>${c.updatedAt?'<div><small>Updated '+fmt(c.updatedAt)+'</small></div>':''}</div><div class=card><b>Signed copy</b>${c.fileDataUrl?`<img class=lightimg src="${c.fileDataUrl}"><div class=actions><button class=ghost onclick="contractPhoto()">Retake photo</button><button class=ghost onclick="contractGallery()">Choose from gallery</button><button class=ghost onclick="remove('contract',1)">Remove</button></div>`:`<p class=muted>Attach a photo of your signed contract.</p><div class=actions><button class=primary onclick="contractPhoto()">Take a photo</button><button class=ghost onclick="contractGallery()">Choose from gallery</button></div>`}</div>`}
async function remove(s,id){await del(s,id);render()}
async function cycle(id){let d=await data(),t=d.tasks.find(x=>x.id===id),o=['pending','in-progress','complete'];t.status=o[(o.indexOf(t.status)+1)%3];await put('tasks',t);render()}
function form(title,body,save){document.getElementById('app').innerHTML=`<h2 class=title>${title}</h2><div class=form>${body}<div class=actions><button class=primary onclick="${save}">Save</button><button class=ghost onclick=render()>Cancel</button></div></div>`}
function newTask(){form('New task',`<input id=t placeholder="Title"><textarea id=td placeholder="Details"></textarea><input id=due type=date>`,'saveTask()')}
async function saveTask(){let t=document.getElementById('t').value.trim();if(!t)return;await put('tasks',{id:uid(),title:t,description:document.getElementById('td').value.trim(),status:'pending',dueDate:document.getElementById('due').value||null,createdAt:new Date().toISOString()});render()}
async function editTask(id){let d=await data(),t=d.tasks.find(x=>x.id===id);form('Edit task',`<input id=t value="${esc(t.title)}"><textarea id=td>${esc(t.description)}</textarea><input id=due type=date value="${esc(t.dueDate||'')}">`,`updateTask('${id}')`)}
async function updateTask(id){let d=await data(),t=d.tasks.find(x=>x.id===id);t.title=document.getElementById('t').value.trim();t.description=document.getElementById('td').value.trim();t.dueDate=document.getElementById('due').value||null;await put('tasks',t);render()}
function newNote(){form('New note',`<input id=nt placeholder="Training session"><textarea id=nc placeholder="What did you learn?"></textarea>`,'saveNote()')}
async function saveNote(){let c=document.getElementById('nc').value.trim();if(!c)return;await put('notes',{id:uid(),title:document.getElementById('nt').value.trim(),content:c,createdAt:new Date().toISOString()});render()}
async function editNote(id){let d=await data(),n=d.notes.find(x=>x.id===id);form('Edit note',`<input id=nt value="${esc(n.title)}"><textarea id=nc>${esc(n.content)}</textarea>`,`updateNote('${id}')`)}
async function updateNote(id){let d=await data(),n=d.notes.find(x=>x.id===id);n.title=document.getElementById('nt').value.trim();n.content=document.getElementById('nc').value.trim();await put('notes',n);render()}
function newContact(){form('New contact',`<input id=cn placeholder="Name"><input id=cj placeholder="Job title"><input id=cs placeholder="Store / branch"><input id=cp placeholder="Phone" type=tel><input id=ce placeholder="Email" type=email><textarea id=co placeholder="Notes"></textarea>`,'saveContact()')}
async function saveContact(){let n=document.getElementById('cn').value.trim();if(!n)return;await put('contacts',{id:uid(),name:n,jobTitle:document.getElementById('cj').value,store:document.getElementById('cs').value,phone:document.getElementById('cp').value,email:document.getElementById('ce').value,notes:document.getElementById('co').value});render()}
async function editContact(id){let d=await data(),c=d.contacts.find(x=>x.id===id);form('Edit contact',`<input id=cn value="${esc(c.name)}"><input id=cj value="${esc(c.jobTitle)}"><input id=cs value="${esc(c.store)}"><input id=cp value="${esc(c.phone)}"><input id=ce value="${esc(c.email)}"><textarea id=co>${esc(c.notes)}</textarea>`,`updateContact('${id}')`)}
async function updateContact(id){let d=await data(),c=d.contacts.find(x=>x.id===id);Object.assign(c,{name:document.getElementById('cn').value.trim(),jobTitle:document.getElementById('cj').value,store:document.getElementById('cs').value,phone:document.getElementById('cp').value,email:document.getElementById('ce').value,notes:document.getElementById('co').value});await put('contacts',c);render()}
function photoMenu(){let i=document.createElement('input');i.type='file';i.accept='image/*';i.capture='environment';i.onchange=()=>{if(i.files[0])addImage(i.files[0])};i.click()}
function contractPhoto(){let i=document.createElement('input');i.type='file';i.accept='image/*';i.capture='environment';i.onchange=()=>{if(i.files[0])setContractImage(i.files[0])};i.click()}
function contractGallery(){let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{if(i.files[0])setContractImage(i.files[0])};i.click()}
function photoGallery(){let i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=()=>[...i.files].forEach(addImage);i.click()}
function compress(file,max=1400,q=.72){return new Promise((res,rej)=>{let r=new FileReader();r.onload=e=>{let im=new Image();im.onload=()=>{let w=im.width,h=im.height;if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=e.target.result};r.onerror=rej;r.readAsDataURL(file)})}
async function addImage(file){let u=await compress(file);await put('photos',{id:uid(),dataUrl:u,caption:'',dateTaken:new Date(file.lastModified||Date.now()).toISOString(),addedAt:new Date().toISOString()});render()}
async function setContractImage(file){let u=await compress(file,1600,.82);let d=await data();await put('contract',{id:1,details:d.contract[0]?.details||'',fileDataUrl:u,fileName:file.name,updatedAt:new Date().toISOString()});render()}
async function saveContract(){let d=await data(),c=d.contract[0]||{id:1,fileDataUrl:null};c.details=document.getElementById('cd').value;c.updatedAt=new Date().toISOString();await put('contract',c);render()}
async function viewPhoto(id){let d=await data(),p=d.photos.find(x=>x.id===id),cap=prompt('Caption (optional)',p.caption||'');if(cap!==null){p.caption=cap;await put('photos',p)}if(confirm('Delete this photo?'))await del('photos',id);render()}
openDB().then(render);
</script></body></html>
